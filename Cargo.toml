[workspace]
members = [
    "crates/ludo-domain",
    "crates/ludo-application",
    "crates/ludo-ai",
    "crates/ludo-infrastructure",
    "crates/ludo-presentation",
    "crates/ludo-runtime",
    "crates/ludo-web",
    "apps/tauri/src-tauri",
    "crates/ludo-network",
    "crates/ludo-server",
    "crates/ludo-simulation",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
authors = ["Ludo contributors"]
description = "A fast, native, feature-complete Ludo board game"

[workspace.dependencies]
flume = "0.12"
if-addrs = "0.15"
mdns-sd = "0.20.2"
rand = "0.10"
rayon = "1.11"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
redundant_clone = "deny"
rc_mutex = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
