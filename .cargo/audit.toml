[advisories]
# Tauri 2.11.5 / Wry 0.55.1 are the latest releases and still resolve glib
# 0.18 through their Linux-only GTK3 backend. This application currently ships
# only macOS and Windows Tauri installers, where glib is not compiled or linked.
# Remove this exception when Tauri migrates its Linux backend to maintained
# gtk-rs bindings, or before adding Linux installer distribution.
ignore = [
    "RUSTSEC-2024-0429",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[output]
# Fail CI for unsound/yanked crates and all non-ignored vulnerabilities.
# Unmaintained Tauri/GTK transitive crates remain visible as warnings.
deny = ["unsound", "yanked"]
format = "terminal"
quiet = false
show_tree = true
