name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  PNPM_VERSION: "11.17.0"
  NODE_VERSION: "22"

jobs:
  fmt:
    name: Fast code formatting check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  rust-verify:
    name: Rust verification and shared compile
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-ci
      - name: Run Rust checks and share compilation
        env:
          RUSTC_WRAPPER: sccache
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --workspace --exclude ludo-tauri --all-targets --all-features --locked -- -D warnings
          cargo nextest run --workspace --exclude ludo-tauri --all-targets --all-features --locked
          cargo doc --workspace --exclude ludo-tauri --all-features --no-deps --locked
          cargo build --locked -p ludo-server

  frontend-types:
    name: Frontend TypeScript check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: TypeScript
        run: pnpm --dir apps/client typecheck

  frontend-unit:
    name: Frontend unit & component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: Unit and component tests
        run: pnpm --dir apps/client test

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: Dependency audit
        run: pnpm --dir apps/client audit --audit-level high

  web:
    name: Production web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_URL: ${{ vars.LUDO_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: wasm-ci
          cache-bin: "true"
          cache-workspace-crates: "false"
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: Install pinned WASM binding tool
        run: |
          if ! command -v wasm-bindgen >/dev/null; then
            mkdir -p ~/.cargo/bin
            curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.126/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin --strip-components=1 wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi
      - name: Build production web application
        env:
          RUSTC_WRAPPER: sccache
        run: node scripts/build-web.mjs --require-api-url --skip-typecheck
      - name: Enforce bundle budgets
        run: node scripts/ops/performance-budget.mjs
      - name: Record artifact provenance and checksums
        run: node scripts/ops/artifact-manifest.mjs create apps/client/dist "${{ github.sha }}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-wasm-runtime
          path: apps/client/src/wasm/pkg
          if-no-files-found: error
          retention-days: 2

  security:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: audit-0.22.2
          cache-targets: "false"
          cache-bin: "true"
      - name: Install pinned audit tool
        env:
          RUSTC_WRAPPER: sccache
        run: |
          if ! command -v cargo-audit >/dev/null; then
            mkdir -p ~/.cargo/bin
            curl -sSL https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz | tar -xz -C ~/.cargo/bin --strip-components=1 || cargo install cargo-audit --version 0.22.2 --locked
          fi
      # SQLx records its inactive, feature-gated MySQL driver in Cargo.lock.
      # PostgreSQL is the only SQLx driver in the resolved server build graph.
      - name: Audit resolved Rust dependencies
        env:
          RUSTC_WRAPPER: sccache
        run: cargo audit --ignore RUSTSEC-2023-0071

  gate:
    name: CI gate
    if: always()
    needs:
      - fmt
      - rust-verify
      - frontend-types
      - frontend-unit
      - frontend-audit
      - web
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI lane
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          RUST_VERIFY_RESULT: ${{ needs.rust-verify.result }}
          FRONTEND_TYPES_RESULT: ${{ needs.frontend-types.result }}
          FRONTEND_UNIT_RESULT: ${{ needs.frontend-unit.result }}
          FRONTEND_AUDIT_RESULT: ${{ needs.frontend-audit.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          for result in \
            "$FMT_RESULT" \
            "$RUST_VERIFY_RESULT" \
            "$FRONTEND_TYPES_RESULT" \
            "$FRONTEND_UNIT_RESULT" \
            "$FRONTEND_AUDIT_RESULT" \
            "$WEB_RESULT" \
            "$SECURITY_RESULT"; do
            test "$result" = success
          done
