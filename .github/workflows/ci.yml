name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"
  PNPM_VERSION: "11.17.0"
  NODE_VERSION: "22"

jobs:
  rust:
    name: Rust quality and server artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-ci
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: >-
          cargo clippy --workspace --exclude ludo-tauri
          --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: >-
          cargo test --workspace --exclude ludo-tauri
          --all-targets --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --workspace --exclude ludo-tauri
          --all-features --no-deps --locked
      - name: Build reusable multiplayer server
        run: cargo build --locked -p ludo-server
      - uses: actions/upload-artifact@v7
        with:
          name: ludo-server-linux
          path: target/debug/ludo-server
          if-no-files-found: error
          retention-days: 2

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: TypeScript
        run: pnpm --dir apps/client typecheck
      - name: Unit and component tests
        run: pnpm --dir apps/client test
      - name: Dependency audit
        run: pnpm --dir apps/client audit --audit-level high

  web:
    name: Production web artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_URL: ${{ vars.LUDO_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: wasm-ci
          cache-bin: "true"
          cache-workspace-crates: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: Install pinned WASM binding tool
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build production web application
        run: node scripts/build-web.mjs --require-api-url --skip-typecheck
      - name: Enforce bundle budgets
        run: node scripts/ops/performance-budget.mjs
      - name: Record artifact provenance and checksums
        run: node scripts/ops/artifact-manifest.mjs create apps/client/dist "${{ github.sha }}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-wasm-runtime
          path: apps/client/src/wasm/pkg
          if-no-files-found: error
          retention-days: 2

  security:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: audit-0.22.2
          cache-targets: "false"
          cache-bin: "true"
      - name: Install pinned audit tool
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
      # SQLx records its inactive, feature-gated MySQL driver in Cargo.lock.
      # PostgreSQL is the only SQLx driver in the resolved server build graph.
      - name: Audit resolved Rust dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071

  multiplayer:
    name: PostgreSQL and multiplayer journey
    needs: [rust, frontend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ludo"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ludo
      LUDO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ludo
      LUDO_ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          lockfile: apps/client/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-ci
      - uses: actions/download-artifact@v8
        with:
          name: ludo-server-linux
          path: artifacts/server
      - uses: actions/download-artifact@v8
        with:
          name: web-wasm-runtime
          path: apps/client/src/wasm/pkg
      - name: Install locked dependencies
        run: pnpm --dir apps/client install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/client exec playwright install --with-deps chromium
      - name: Build browser test application from verified WASM
        run: pnpm --dir apps/client exec vite build
      - name: PostgreSQL invariants and migrations
        run: >-
          cargo test --locked -p ludo-server
          server::integration_tests -- --test-threads=1
      - name: Start verified multiplayer server
        run: |
          chmod +x artifacts/server/ludo-server
          artifacts/server/ludo-server >server.log 2>&1 &
          for attempt in {1..90}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Server smoke test
        run: scripts/ops/smoke-test.sh http://127.0.0.1:8080
      - name: Desktop and mobile browser journeys
        run: pnpm --dir apps/client test:e2e
      - name: Readiness load budget
        env:
          LUDO_LOAD_URL: http://127.0.0.1:8080
          LUDO_LOAD_CONCURRENCY: 25
          LUDO_LOAD_ITERATIONS: 10
        run: node scripts/ops/load-test.mjs
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: multiplayer-diagnostics
          path: |
            server.log
            apps/client/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [rust, frontend, web, security, multiplayer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI lane
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MULTIPLAYER_RESULT: ${{ needs.multiplayer.result }}
        run: |
          for result in \
            "$RUST_RESULT" \
            "$FRONTEND_RESULT" \
            "$WEB_RESULT" \
            "$SECURITY_RESULT" \
            "$MULTIPLAYER_RESULT"; do
            test "$result" = success
          done
