name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: core
      - run: cargo fmt --all --check
      - run: >-
          cargo clippy --workspace --exclude ludo-tauri
          --all-targets --all-features --locked -- -D warnings
      - run: >-
          cargo test --workspace --exclude ludo-tauri
          --all-targets --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --workspace --exclude ludo-tauri
          --all-features --no-deps --locked

  web:
    name: React and WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.LUDO_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: wasm
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: pnpm --dir apps/client install --frozen-lockfile
      - run: pnpm --dir apps/client typecheck
      - run: node scripts/build-web.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  multiplayer-e2e:
    name: Multiplayer browser journey
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ludo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ludo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ludo
      LUDO_ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e
      - run: pnpm --dir apps/client install --frozen-lockfile
      - run: pnpm --dir apps/client exec playwright install --with-deps chromium
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: node scripts/build-web.mjs
      - name: Start multiplayer server
        run: |
          cargo run --locked -p ludo-server >server.log 2>&1 &
          for attempt in {1..180}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - run: pnpm --dir apps/client test:e2e

  security:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: audit-0.22.2
          cache-targets: "false"
          cache-bin: "true"
      - run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
      # SQLx records its inactive, feature-gated MySQL driver in Cargo.lock.
      # ludo-server disables SQLx defaults and enables PostgreSQL only, so rsa
      # is not present in the resolved build graph (`cargo tree -i rsa` is empty).
      - run: cargo audit --ignore RUSTSEC-2023-0071
