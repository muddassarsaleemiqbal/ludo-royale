name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  prepare:
    name: Prepare patch release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.release_guard.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prevent release loops
        id: release_guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q '^chore(release): v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next patch version
        id: version
        if: steps.release_guard.outputs.skip != 'true'
        shell: bash
        run: |
          version="$(cargo run --quiet -p xtask -- next-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing Ludo Royale v$version"

  macos:
    name: Universal macOS DMG
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-packager
            target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.CARGO_PACKAGER_VERSION }}
          restore-keys: release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply release version
        shell: bash
        run: |
          cargo run --quiet -p xtask -- set-version "$APP_VERSION"
          cargo metadata --format-version 1 >/dev/null

      - name: Install universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both macOS architectures
        shell: bash
        run: |
          cargo build -p ludo-desktop --release --locked --target aarch64-apple-darwin
          cargo build -p ludo-desktop --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/ludo-desktop \
            target/x86_64-apple-darwin/release/ludo-desktop \
            -output target/universal-apple-darwin/release/ludo-desktop
          lipo -verify_arch arm64 x86_64 target/universal-apple-darwin/release/ludo-desktop

      - name: Enable Apple distribution signing
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_CERTIFICATE_PASSWORD != ''
        shell: bash
        run: |
          perl -0pi -e \
            's/\[package.metadata.packager.macos\]/[package.metadata.packager.macos]\nsigning-identity = "Developer ID Application"/' \
            crates/ludo-desktop/Cargo.toml

      - name: Install cargo-packager
        shell: bash
        run: command -v cargo-packager >/dev/null || cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

      - name: Create DMG
        shell: bash
        run: |
          find target/universal-apple-darwin/release \
            -maxdepth 1 -name '*.dmg' -delete
          cargo packager --release --target universal-apple-darwin \
            --formats dmg --packages ludo-desktop

      - name: Notarize and staple DMG
        if: >-
          env.APPLE_CERTIFICATE != '' &&
          env.APPLE_CERTIFICATE_PASSWORD != '' &&
          env.APPLE_ID != '' &&
          env.APPLE_PASSWORD != '' &&
          env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          dmg="$(find target/universal-apple-darwin/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Verify DMG
        shell: bash
        run: |
          dmg="$(find target/universal-apple-darwin/release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ludo-royale-${{ env.APP_VERSION }}-macos
          path: target/universal-apple-darwin/release/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows EXE and MSI
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-packager.exe
            target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.CARGO_PACKAGER_VERSION }}
          restore-keys: release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply release version
        shell: pwsh
        run: |
          cargo run --quiet -p xtask -- set-version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/codesign -Force | Out-Null
          $certificatePath = Join-Path $PWD "target/codesign/ludo-royale.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password)
          $certificate = $certificates |
            Where-Object HasPrivateKey |
            Select-Object -First 1
          if ($null -eq $certificate) { throw "Windows certificate import failed" }

          $manifestPath = Join-Path $PWD "crates/ludo-desktop/Cargo.toml"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          $replacement = "[package.metadata.packager.windows]`ncertificate-thumbprint = `"$($certificate.Thumbprint)`""
          $manifest = $manifest.Replace("[package.metadata.packager.windows]", $replacement)
          [IO.File]::WriteAllText($manifestPath, $manifest)
          "WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows application
        run: cargo build -p ludo-desktop --release --locked

      - name: Install cargo-packager
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-packager -ErrorAction SilentlyContinue)) {
            cargo install cargo-packager --version $env:CARGO_PACKAGER_VERSION --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create NSIS and MSI installers
        shell: pwsh
        run: |
          Remove-Item target/release/*-setup.exe -Force -ErrorAction SilentlyContinue
          Remove-Item target/release/*.msi -Force -ErrorAction SilentlyContinue
          cargo packager --release --formats nsis,wix --packages ludo-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installers and signatures
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem target/release/*-setup.exe
            Get-ChildItem target/release/*.msi
          )
          if ($installers.Count -ne 2) {
            throw "Expected one NSIS installer and one MSI, found $($installers.Count)"
          }
          if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature $installer.FullName
              if ($signature.Status -ne "Valid") {
                throw "Invalid signature on $($installer.Name): $($signature.Status)"
              }
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ludo-royale-${{ env.APP_VERSION }}-windows
          path: |
            target/release/*-setup.exe
            target/release/*.msi
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Version, tag, and publish
    needs: [prepare, macos, windows]
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Cache SBOM generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-cyclonedx
            target
          key: cargo-cyclonedx-${{ runner.os }}-${{ runner.arch }}-0.5.9-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-cyclonedx-${{ runner.os }}-${{ runner.arch }}-0.5.9-

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ludo-royale-${{ env.APP_VERSION }}-*
          path: dist
          merge-multiple: true

      - name: Create or recover version commit and tag
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"
          git fetch origin main --tags

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            release_sha="$(git rev-parse "$tag^{commit}")"
            parent_sha="$(git rev-parse "$release_sha^")"
            if [[ "$parent_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing $tag was not created from the verified source commit."
              exit 1
            fi
          else
            current_main="$(git rev-parse origin/main)"
            if [[ "$current_main" != "$SOURCE_SHA" ]]; then
              echo "::error::main changed after CI. Its newer CI run will create the release."
              exit 1
            fi

            git checkout --detach "$SOURCE_SHA"
            cargo run --quiet -p xtask -- set-version "$APP_VERSION"
            cargo metadata --format-version 1 >/dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): v$APP_VERSION"
            release_sha="$(git rev-parse HEAD)"
            git tag -a "$tag" -m "Ludo Royale $tag"
            git push --atomic origin "HEAD:main" "refs/tags/$tag:refs/tags/$tag"
          fi

          git checkout --detach "$release_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          command -v cargo-cyclonedx >/dev/null || \
            cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx \
            --manifest-path crates/ludo-desktop/Cargo.toml \
            --format json \
            --target all \
            --all-features \
            --spec-version 1.5 \
            --override-filename "ludo-royale-$APP_VERSION-sbom"
          sbom="crates/ludo-desktop/ludo-royale-$APP_VERSION-sbom.json"
          test -f "$sbom"
          mv "$sbom" dist/
          find crates tools -name "ludo-royale-$APP_VERSION-sbom.json" -delete

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        run: |
          tag="${{ steps.release_ref.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "${{ steps.release_ref.outputs.release_sha }}" \
              --title "Ludo Royale $tag" \
              --generate-notes \
              --verify-tag
          fi
