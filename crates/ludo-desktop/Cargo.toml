[package]
name = "ludo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
ludo-ai = { path = "../ludo-ai" }
ludo-application = { path = "../ludo-application" }
ludo-domain = { path = "../ludo-domain" }
ludo-infrastructure = { path = "../ludo-infrastructure" }
ludo-network = { path = "../ludo-network" }
ludo-presentation = { path = "../ludo-presentation" }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[package.metadata.packager]
product-name = "Ludo Royale"
identifier = "com.ludoroyale.desktop"
publisher = "Ludo Royale"
category = "BoardGame"
license-file = "../../LICENSE"
copyright = "Copyright © 2026 Ludo contributors"
icons = [
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
    "assets/icons/icon.png",
]
resources = ["../../LICENSE"]

[package.metadata.packager.macos]
minimum-system-version = "12.0"

[package.metadata.packager.windows]
allow-downgrades = false
digest-algorithm = "sha256"
timestamp-url = "http://timestamp.digicert.com"
tsp = true

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
installer-mode = "currentUser"
languages = ["English"]

[package.metadata.packager.wix]
languages = ["en-US"]

[lints]
workspace = true
